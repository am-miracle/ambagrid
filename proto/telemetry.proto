syntax = "proto3";

package ambagrid.telemetry;

option go_package = "ingestion-go/proto/ambagrid/telemetry;telemetry";

// Core enumeration defining what kind of device is reporting metrics
enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  DEVICE_TYPE_SMART_METER = 1;
  DEVICE_TYPE_BATTERY_BMS = 2;
  DEVICE_TYPE_SOLAR_INVERTER = 3;
}

// Sub-message grouping raw electrical metrics
message ElectricalMetrics {
  float voltage = 1;         // Volts (V)
  float current = 2;         // Amperes (A)
  float active_power = 3;    // Kilowatts (kW)
  float frequency = 4;       // Hertz (Hz)
  double total_kwh = 5;      // Cumulative Kilowatt-hours (kWh) for billing
}

// The master telemetry packet sent by edge hardware into the pipeline
message MetricPayload {
  string device_id = 1;        // Unique physical hardware identifier (e.g., "met-5540")
  DeviceType device_type = 2;  // Type of physical appliance sending data
  int64 timestamp_utc = 3;     // Unix epoch timestamp in seconds

  // --- The Ontology Linkage Layer ---
  // Passing these relations down the wire helps the Rust engine speed up graph traversals
  string site_id = 4;          // The Mini-Grid facility identifier (e.g., "ng-kaji-01")
  string household_id = 5;     // Optional: Connects smart meters directly to physical properties

  // --- Real-Time Hardware Sensor Diagnostics ---
  ElectricalMetrics metrics = 6;
  float internal_temperature = 7; // Celsius (°C) to trigger fire/overheating rules
  bool relay_closed = 8;          // True = Power is active, False = Customer is disconnected

  // --- Battery/Inverter Specialized States (Populated based on DeviceType) ---
  float battery_soc_pct = 9;      // State of Charge (0.0 to 100.0%) for BMS nodes
  float solar_irradiance = 10;    // W/m² input reading for solar inverter arrays
}

# git-cliff configuration for AmbaGrid.
# Generate locally with: git cliff -o CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to AmbaGrid will be documented here.

This project follows the spirit of Keep a Changelog. Dates use `YYYY-MM-DD`.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\
"""
trim = true
footer = """
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

commit_parsers = [
  { message = "^first commit", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^docs: update generated changelog", skip = true },
  { message = "^docs\\(changelog\\):", skip = true },
  { message = "^docs: add senior engineering practices", skip = true },
  { message = "^docs: stop tracking senior engineering guide", skip = true },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^test", group = "Testing" },
  { message = "^refactor", group = "Changed" },
  { message = "^style", group = "Changed" },
  { message = "^chore", group = "Maintenance" },
  { message = "^Add", group = "Added" },
  { message = ".*", group = "Other" },
]

filter_commits = false
topo_order = false

# Dedicated command broker: never reuse the anonymous development broker.
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/config/commands.acl
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
log_dest stdout

services:
  command-broker:
    image: eclipse-mosquitto:2.0
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./commands.acl:/mosquitto/config/commands.acl:ro
      - ./secrets:/mosquitto/secrets:ro
      - command_broker_data:/mosquitto/data
    restart: unless-stopped
volumes:
  command_broker_data:

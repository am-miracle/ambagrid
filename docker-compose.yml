services:
  # 1. MQTT Broker (The Hardware Ingestion Entryway)
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: ambagrid-mqtt
    ports:
      - "1883:1883"   # Standard unencrypted MQTT port
      - "9001:9001"   # MQTT over WebSockets (optional for web clients)
    volumes:
      - mqtt_config:/mosquitto/config
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    # Command to allow anonymous connections locally for easy developer onboarding
    entrypoint: >
      sh -c "mkdir -p /mosquitto/config &&
             echo 'listener 1883 0.0.0.0' > /mosquitto/config/mosquitto.conf &&
             echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf &&
             echo 'listener 9001 0.0.0.0' >> /mosquitto/config/mosquitto.conf &&
             echo 'protocol websockets' >> /mosquitto/config/mosquitto.conf &&
             /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    networks:
      - ambagrid-network

  # 2. Redpanda (Ultra-fast, zero-dependency Kafka Streaming Core)
  redpanda:
    image: redpandadata/redpanda:v24.3.4
    container_name: ambagrid-streaming
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"   # Accessible outside the container for your local Go/Rust services
    networks:
      - ambagrid-network

  # 3. One-shot topic provisioning
  #
  # Topics are created explicitly rather than auto-created, because an
  # auto-created topic silently gets the cluster default of one partition —
  # and consumer-group parallelism is capped at the partition count, so a
  # 1-partition telemetry topic caps the engine at a single working replica
  # no matter how many you deploy.
  #
  # Raising the partition count of an existing topic rehashes keys: a meter
  # whose readings hashed to partition 0 may hash elsewhere afterwards, so its
  # old and new records sit on different partitions and can be consumed out of
  # order across the boundary. Locally, drop and recreate the topic. In a real
  # deployment this needs a planned cutover.
  redpanda-topics:
    image: redpandadata/redpanda:v24.3.4
    container_name: ambagrid-topics
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        until rpk cluster info --brokers redpanda:29092 >/dev/null 2>&1; do
          echo "waiting for redpanda..."
          sleep 1
        done
        # Telemetry is the only high-volume topic, so it is the only one
        # partitioned for parallel consumers. 12 caps the engine at 12 working
        # replicas, well beyond current fleet sizes.
        rpk topic create telemetry.ingested -p 12 --brokers redpanda:29092 || true
        # Low volume by definition, and a single partition keeps alert events
        # globally ordered for anything reading them back.
        rpk topic create telemetry.ingested.dlq -p 1 --brokers redpanda:29092 || true
        rpk topic create alert.opened -p 1 --brokers redpanda:29092 || true
        rpk topic create alert.resolved -p 1 --brokers redpanda:29092 || true
        rpk topic list --brokers redpanda:29092
    depends_on:
      - redpanda
    networks:
      - ambagrid-network

  # 4. Redpanda Console (Web UI to view your live message streams)
  redpanda-console:
    image: redpandadata/console:v2.8.3
    container_name: ambagrid-streaming-ui
    entrypoint: /app/console --config.filepath=/etc/console/config.yml
    volumes:
      - ./deploy/redpanda-console/config.yml:/etc/console/config.yml
      - ./proto/telemetry.proto:/etc/console/proto/telemetry.proto
    ports:
      - "8080:8080"   # Open http://localhost:8080 to watch hardware metrics live
    depends_on:
      - redpanda
    networks:
      - ambagrid-network

  # 5. MQTT to Redpanda ingestion bridge
  ingestion-go:
    build:
      context: ./services/ingestion-go
    container_name: ambagrid-ingestion
    restart: unless-stopped
    environment:
      MQTT_BROKER: tcp://mqtt-broker:1883
      MQTT_TOPIC_FILTER: africa-west/+/+/+/telemetry
      KAFKA_BROKERS: redpanda:29092
      KAFKA_TOPIC: telemetry.ingested
      KAFKA_DLQ_TOPIC: telemetry.ingested.dlq
      # Off so a mistyped topic fails loudly instead of silently creating a
      # 1-partition topic that caps throughput. redpanda-topics owns creation.
      KAFKA_ALLOW_AUTO_TOPIC: "false"
      INGESTION_LOG_EVERY_N: 25
    depends_on:
      - mqtt-broker
      - redpanda
      - redpanda-topics
    networks:
      - ambagrid-network

  # 6. PostgreSQL + TimescaleDB (Relational & High-Density Metric Storage)
  database:
    image: timescale/timescaledb:2.17.2-pg15
    container_name: ambagrid-db
    environment:
      POSTGRES_USER: ambagrid_admin
      POSTGRES_PASSWORD: ambagrid_secure_pass
      POSTGRES_DB: ambagrid_operational
    ports:
      - "5432:5432"   # Connect via your Go API or table managers (DBeaver/pgAdmin)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Dependents wait on this rather than on the container merely starting:
    # Postgres runs initdb on a fresh volume, so "started" is several seconds
    # short of "accepting connections".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambagrid_admin -d ambagrid_operational"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ambagrid-network

  # 7. Operator API (HTTP view of asset state, alerts, and narrow commands)
  #
  # Stateless, so replicas scale horizontally behind a load balancer.
  # DB_MAX_CONNS is the cap on the load one replica can put on
  # Postgres: multiply by replica count before raising it, and expect a
  # connection pooler rather than a bigger number once that product grows.
  #
  # No container_name, so `--scale api-go=N` works here; drop the published
  # port below when scaling locally, or the second replica cannot bind it.
  api-go:
    build:
      context: ./services/api-go
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ambagrid_admin:ambagrid_secure_pass@database:5432/ambagrid_operational
      API_HTTP_ADDR: ":8081"
      API_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      DB_MAX_CONNS: "10"
    ports:
      - "8081:8081"   # http://localhost:8081/v1/sites
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ambagrid-network

  # 8. Transactional outbox publisher
  #
  # Operator commands and engine alert transitions write business events into
  # Postgres inside the same transaction as the state change. This worker
  # encodes and drains those durable rows to Redpanda, then marks them published.
  outbox-publisher:
    build:
      context: .
      dockerfile: ./services/engine-rust/Dockerfile
    restart: unless-stopped
    command: ["publish-outbox"]
    environment:
      DATABASE_URL: postgres://ambagrid_admin:ambagrid_secure_pass@database:5432/ambagrid_operational
      KAFKA_BROKERS: redpanda:29092
      LOG_FORMAT: json
    depends_on:
      database:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
    networks:
      - ambagrid-network

volumes:
  mqtt_config:
  mqtt_data:
  mqtt_log:
  postgres_data:

networks:
  ambagrid-network:
    driver: bridge

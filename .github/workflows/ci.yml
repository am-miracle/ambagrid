name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: |
            go.sum
            services/api-go/go.sum
            services/ingestion-go/go.sum

      - name: Check root Go formatting
        run: test -z "$(gofmt -l scripts)"

      - name: Vet root Go module
        run: go vet ./...

      - name: Test root Go module
        run: go test -race ./...

      - name: Check API formatting
        working-directory: services/api-go
        run: test -z "$(gofmt -l .)"

      - name: Vet API service
        working-directory: services/api-go
        run: go vet ./...

      - name: Test API service
        working-directory: services/api-go
        run: go test -race ./...

      - name: Check ingestion formatting
        working-directory: services/ingestion-go
        run: test -z "$(gofmt -l .)"

      - name: Vet ingestion service
        working-directory: services/ingestion-go
        run: go vet ./...

      - name: Test ingestion service
        working-directory: services/ingestion-go
        run: go test -race ./...

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine-rust
    services:
      database:
        image: timescale/timescaledb:2.17.2-pg15
        env:
          POSTGRES_USER: ambagrid_admin
          POSTGRES_PASSWORD: ambagrid_secure_pass
          POSTGRES_DB: ambagrid_operational
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ambagrid_admin -d ambagrid_operational"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/engine-rust

      - name: Install cargo-chef
        run: cargo install cargo-chef --locked

      - name: Prepare Rust dependency recipe
        run: cargo chef prepare --recipe-path "$RUNNER_TEMP/engine-rust-recipe.json"

      - name: Build Rust dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/engine-rust-cargo-chef"
          cp "$RUNNER_TEMP/engine-rust-recipe.json" "$RUNNER_TEMP/engine-rust-cargo-chef/recipe.json"
          cd "$RUNNER_TEMP/engine-rust-cargo-chef"
          cargo chef cook --recipe-path recipe.json

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      # Serial: each of these tests runs the migrator against the one shared
      # database, and concurrent migrations race on object creation.
      - name: Run database-backed tests
        env:
          DATABASE_URL: postgres://ambagrid_admin:ambagrid_secure_pass@localhost:5432/ambagrid_operational
        run: cargo test -- --ignored --test-threads=1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Biome checks
        run: npm run check

      - name: Build frontend
        run: npm run build

  changelog:
    name: Changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Check generated changelog
        run: make changelog-check

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet
